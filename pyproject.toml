[project]
name = "milemap"
version = "0.1.0"
description = "MileMap: the price of a mile, wherever you live. Data collection and pipelines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.124",
    "httpx>=0.27",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[project.scripts]
milemap = "milemap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milemap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
